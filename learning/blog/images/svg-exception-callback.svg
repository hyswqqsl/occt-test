<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
  </defs>

  <text x="440" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c3e50">坑：C++ 异常穿过 C 回调 → std::terminate</text>

  <!-- 调用栈 -->
  <g font-size="13.5">
    <rect x="60" y="50"  width="440" height="40" rx="6" fill="#f2f3f4" stroke="#909497"/>
    <text x="280" y="75" text-anchor="middle" fill="#2c3e50">GLFW 事件循环（C 代码，无 C++ 异常展开表）</text>

    <rect x="60" y="100" width="440" height="40" rx="6" fill="#f2f3f4" stroke="#909497"/>
    <text x="280" y="125" text-anchor="middle" fill="#2c3e50">key_callback（我们的 lambda）</text>

    <rect x="60" y="150" width="440" height="40" rx="6" fill="#f2f3f4" stroke="#909497"/>
    <text x="280" y="175" text-anchor="middle" fill="#2c3e50">displayShape() → extractTriangulationEdges()</text>

    <rect x="60" y="200" width="440" height="40" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
    <text x="280" y="225" text-anchor="middle" fill="#c0392b" font-weight="bold">OCCT 内部 throw StdFail_NotDone</text>
  </g>

  <!-- 红色路径: 异常上抛 -->
  <path d="M 55 210 C 20 210, 20 90, 50 70" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="24" y="150" font-size="13" fill="#c0392b" transform="rotate(-90 24 150)" text-anchor="middle">异常上抛</text>
  <rect x="20" y="248" width="520" height="52" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="280" y="270" text-anchor="middle" font-size="13.5" fill="#c0392b" font-weight="bold">穿过 C 栈帧 → 找不到 unwind 信息 → std::terminate() → 进程崩溃</text>
  <text x="280" y="290" text-anchor="middle" font-size="12.5" fill="#943126">调试器表现为断在 __cxa_throw</text>

  <!-- 绿色路径: 修复 -->
  <g font-size="13.5">
    <rect x="620" y="150" width="230" height="90" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
    <text x="735" y="178" text-anchor="middle" font-weight="bold" fill="#1e8449">修复：在回调内就地捕获</text>
    <text x="735" y="200" text-anchor="middle" fill="#555">catch (const Standard_Failure&amp;)</text>
    <text x="735" y="220" text-anchor="middle" fill="#555">打印消息 + 保留旧显示</text>
  </g>
  <line x1="510" y1="195" x2="618" y2="195" stroke="#27ae60" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="564" y="185" text-anchor="middle" font-size="12.5" fill="#1e8449">异常不出 C 栈帧</text>
</svg>
